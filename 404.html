<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wrong door — Tha Carter Studios</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0A08">
<link rel="icon" href="/thacarterstudios/assets/brand/tha-carter-monogram-gold-on-ink.svg">
<style>
@font-face{font-family:"Carter Black";src:url("/thacarterstudios/assets/fonts/carter-black.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Carter Caps";src:url("/thacarterstudios/assets/fonts/carter-caps.woff2") format("woff2");font-weight:600;font-display:swap}
:root{--night:#0B0A08;--brass:#E3B14A;--brass-lt:#F6D98A;--ink:#14110D;--bone:#F5F1E8;--mute:#98907F;
  --line:rgba(227,177,74,.20);--caps:"Carter Caps",ui-sans-serif,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
  background:var(--night);color:var(--bone);text-align:center;
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.65}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(70% 45% at 50% 8%,rgba(227,177,74,.14),transparent 70%),
             radial-gradient(60% 40% at 50% 100%,rgba(39,64,200,.14),transparent 70%)}
main{position:relative;max-width:46ch}
img{width:78px;height:78px;border-radius:16px;margin:0 auto 26px;display:block}
.code{font-family:var(--caps);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--brass);margin:0 0 14px}
h1{font-family:"Carter Black",Georgia,serif;font-weight:400;font-size:clamp(34px,8vw,54px);
  line-height:1.05;margin:0 0 16px}
p{color:var(--mute);margin:0 0 30px;font-size:16px}
a{display:inline-block;font-family:var(--caps);font-size:12.5px;letter-spacing:.16em;
  text-transform:uppercase;padding:13px 24px;border-radius:5px;text-decoration:none;
  border:1px solid var(--brass);background:var(--brass);color:var(--ink)}
a:hover{background:var(--brass-lt)}
a.ghost{background:none;color:var(--brass);margin-left:8px}
a.ghost:hover{background:rgba(227,177,74,.1)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <img src="/thacarterstudios/assets/brand/tha-carter-monogram-gold-on-ink.svg" alt="Tha Carter Studios">
  <p class="code">Error 404</p>
  <h1>Wrong door.</h1>
  <p>That page is not in this building. The booth is down the hall.</p>
  <div class="row">
    <a href="/thacarterstudios/">Back to the studio</a>
    <a class="ghost" href="tel:+18004490306">Call instead</a>
  </div>
</main>
</body>
</html>
